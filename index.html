<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100 Hommes vs 1 Gorille</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin: 15px 0 5px;
  font-size: 28px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 10px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 18px;
  margin: 10px;
}

.arena {
  position: relative;
  width: 95%;
  max-width: 1000px;
  height: 500px;
  margin: auto;
  overflow: hidden;
  border: 4px solid #555;
  border-radius: 18px;
  background:
    radial-gradient(circle at 50% 40%, #354b38 0%, #17231b 70%);
  box-shadow: 0 0 30px #000;
}

.gorilla {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 90px;
  transition: left .25s, top .25s;
  z-index: 5;
}

.gorilla.hit {
  animation: hit .25s;
}

.gorilla.attack {
  animation: gorillaAttack .35s;
}

@keyframes hit {
  50% {
    transform: translate(-50%, -50%) scale(1.3);
    filter: brightness(2);
  }
}

@keyframes gorillaAttack {
  50% {
    transform: translate(-50%, -50%) scale(1.25);
  }
}

.man {
  position: absolute;
  font-size: 28px;
  transition: left .35s, top .35s, opacity .3s;
  z-index: 3;
}

.man.attacking {
  animation: manAttack .3s;
}

@keyframes manAttack {
  50% {
    transform: scale(1.4);
  }
}

.man.dead {
  opacity: 0;
  transform: rotate(90deg) scale(.3);
}

.healthBox {
  width: 80%;
  max-width: 600px;
  height: 25px;
  background: #333;
  border-radius: 20px;
  margin: 10px auto;
  overflow: hidden;
  border: 2px solid #777;
}

.health {
  width: 100%;
  height: 100%;
  background: #22c55e;
  transition: width .25s, background .25s;
}

.controls {
  margin: 15px auto;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 22px;
  margin: 5px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#attack {
  background: #dc2626;
  color: white;
}

#attack:active {
  transform: scale(.94);
}

#reset {
  background: #ddd;
  color: #111;
}

#status {
  min-height: 35px;
  font-size: 19px;
  margin: 10px;
  font-weight: bold;
}

.log {
  width: 90%;
  max-width: 700px;
  margin: 10px auto;
  height: 90px;
  overflow-y: auto;
  background: #080d11;
  border-radius: 10px;
  padding: 8px;
  text-align: left;
  font-size: 14px;
}

.log div {
  margin: 3px;
  color: #ccc;
}
</style>
</head>

<body>

<h1>🦍 100 HOMMES VS 1 GORILLE 🧑‍🤝‍🧑</h1>

<div class="subtitle">
Simulation de combat
</div>

<div class="stats">
  <div>🧑 Hommes : <b id="menCount">100</b></div>
  <div>🦍 Vie du gorille : <b id="gorillaHPText">1000</b></div>
</div>

<div class="healthBox">
  <div id="health" class="health"></div>
</div>

<div id="arena" class="arena">

  <div id="gorilla" class="gorilla">
    🦍
  </div>

</div>

<div class="controls">

  <button id="attack">
    ⚔️ ATTAQUER
  </button>

  <button id="reset">
    🔄 RECOMMENCER
  </button>

</div>

<div id="status">
  Le combat va commencer !
</div>

<div id="log" class="log"></div>

<script>

const arena = document.getElementById("arena");
const gorilla = document.getElementById("gorilla");
const menCount = document.getElementById("menCount");
const health = document.getElementById("health");
const hpText = document.getElementById("gorillaHPText");
const status = document.getElementById("status");
const log = document.getElementById("log");

let men = [];
let gorillaHP = 1000;
let gameOver = false;
let attacking = false;

const MAX_HP = 1000;

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function addLog(text) {
  const line = document.createElement("div");
  line.textContent = text;
  log.prepend(line);
}

function createMen() {

  men.forEach(man => man.remove());

  men = [];

  for (let i = 0; i < 100; i++) {

    const man = document.createElement("div");

    man.className = "man";
    man.textContent = "🧑";

    const angle = (Math.PI * 2 / 100) * i;

    const radiusX = random(260, 390);
    const radiusY = random(150, 210);

    const x = 50 + Math.cos(angle) * radiusX / 10;
    const y = 50 + Math.sin(angle) * radiusY / 5;

    man.style.left = x + "%";
    man.style.top = y + "%";

    arena.appendChild(man);

    men.push(man);
  }

  updateMen();
}

function updateMen() {

  const alive = men.filter(man =>
    !man.classList.contains("dead")
  ).length;

  menCount.textContent = alive;
}

function updateHealth() {

  const percentage = Math.max(0, gorillaHP / MAX_HP * 100);

  health.style.width = percentage + "%";
  hpText.textContent = Math.max(0, Math.round(gorillaHP));

  if (percentage < 30) {
    health.style.background = "#ef4444";
  }
  else if (percentage < 60) {
    health.style.background = "#f59e0b";
  }
  else {
    health.style.background = "#22c55e";
  }
}

function gorillaMove() {

  const x = random(42, 58);
  const y = random(40, 60);

  gorilla.style.left = x + "%";
  gorilla.style.top = y + "%";
}

function killMen() {

  const aliveMen = men.filter(man =>
    !man.classList.contains("dead")
  );

  if (aliveMen.length === 0) {
    return 0;
  }

  const amount = Math.min(
    aliveMen.length,
    Math.floor(random(1, 5))
  );

  for (let i = 0; i < amount; i++) {

    const index = Math.floor(
      Math.random() * aliveMen.length
    );

    const victim = aliveMen.splice(index, 1)[0];

    victim.classList.add("dead");
  }

  updateMen();

  return amount;
}

function attack() {

  if (gameOver || attacking) {
    return;
  }

  attacking = true;

  const aliveMen = men.filter(man =>
    !man.classList.contains("dead")
  );

  if (aliveMen.length === 0) {
    finishGorillaWin();
    return;
  }

  status.textContent = "⚔️ Les hommes attaquent !";

  // Animation de plusieurs hommes
  const attackers = aliveMen
    .sort(() => Math.random() - 0.5)
    .slice(0, Math.min(12, aliveMen.length));

  attackers.forEach(man => {
    man.classList.add("attacking");

    setTimeout(() => {
      man.classList.remove("attacking");
    }, 300);
  });

  // Dégâts des hommes
  const damage = Math.floor(
    random(25, 65) * (aliveMen.length / 100)
  );

  gorillaHP -= damage;

  if (gorillaHP < 0) {
    gorillaHP = 0;
  }

  gorilla.classList.add("hit");

  setTimeout(() => {
    gorilla.classList.remove("hit");
  }, 250);

  updateHealth();

  addLog(
    "⚔️ Les hommes infligent " +
    damage +
    " dégâts au gorille."
  );

  if (gorillaHP <= 0) {
    finishMenWin();
    return;
  }

  // Le gorille riposte
  setTimeout(() => {

    if (gameOver) {
      return;
    }

    gorilla.classList.add("attack");

    setTimeout(() => {
      gorilla.classList.remove("attack");
    }, 350);

    const victims = killMen();

    if (victims > 0) {

      status.textContent =
        "🦍 Le gorille riposte et élimine " +
        victims +
        " homme(s) !";

      addLog(
        "🦍 Le gorille élimine " +
        victims +
        " homme(s)."
      );

    }

    gorillaMove();

    const remaining =
      men.filter(man =>
        !man.classList.contains("dead")
      ).length;

    if (remaining <= 0) {
      finishGorillaWin();
      return;
    }

    attacking = false;

  }, 450);
}

function finishMenWin() {

  gameOver = true;
  attacking = false;

  status.textContent =
    "🏆 VICTOIRE ! LES 100 HOMMES ONT VAINCU LE GORILLE !";

  addLog("🏆 Les hommes remportent le combat !");
}

function finishGorillaWin() {

  gameOver = true;
  attacking = false;

  status.textContent =
    "🦍 VICTOIRE DU GORILLE ! TOUS LES HOMMES SONT À TERRE !";

  addLog("🦍 Le gorille remporte le combat !");
}

function resetGame() {

  gorillaHP = MAX_HP;
  gameOver = false;
  attacking = false;

  gorilla.style.left = "50%";
  gorilla.style.top = "50%";

  log.innerHTML = "";

  createMen();
  updateHealth();

  status.textContent =
    "🔥 Le combat commence !";

  addLog(
    "🔥 100 hommes entrent dans l'arène."
  );

  addLog(
    "🦍 Le gorille attend son adversaire..."
  );
}

document
  .getElementById("attack")
  .addEventListener("click", attack);

document
  .getElementById("reset")
  .addEventListener("click", resetGame);

resetGame();

</script>

</body>
</html>
