<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bagarre Hommes Gorille</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

background:#080b10;

color:white;

font-family:Arial,sans-serif;

text-align:center;

overflow:hidden;

}

h1{

margin:10px 0 3px;

font-size:26px;

}

.subtitle{

color:#9ca3af;

font-size:14px;

}

.stats{

display:flex;

justify-content:center;

gap:8px;

flex-wrap:wrap;

margin:7px;

}

.stat{

background:#17202a;

padding:7px 10px;

border-radius:9px;

font-size:14px;

font-weight:bold;

}

.healthBox{

width:80%;

max-width:600px;

height:21px;

margin:7px auto;

background:#292929;

border:2px solid #666;

border-radius:20px;

overflow:hidden;

}

.health{

height:100%;

width:100%;

background:#22c55e;

transition:width .2s,background .2s;

}

.viewport{

position:relative;

width:96%;

max-width:1100px;

height:540px;

margin:auto;

overflow:hidden;

border:4px solid #4b5563;

border-radius:20px;

background:#111;

box-shadow:0 0 35px #000;

}

.world{

position:absolute;

width:180%;

height:180%;

left:-40%;

top:-40%;

background:

radial-gradient(circle,#496742 0%,#29402c 45%,#111a14 100%);

transition:transform .18s ease-out;

}

.world:after{

content:"";

position:absolute;

inset:0;

box-shadow:inset 0 0 100px #0009;

pointer-events:none;

}

.arenaMark{

position:absolute;

left:50%;

top:50%;

width:80%;

height:75%;

transform:translate(-50%,-50%);

border:3px solid #ffffff22;

border-radius:50%;

}

.gorilla{

position:absolute;

font-size:82px;

z-index:20;

transform:translate(-50%,-50%);

transition:left .12s linear,top .12s linear;

filter:drop-shadow(0 8px 5px #0009);

}

.gorilla.rage{

animation:rage .22s infinite alternate;

}

@keyframes rage{

from{transform:translate(-50%,-50%) scale(1)}

to{transform:translate(-50%,-50%) scale(1.15)}

}

.man{

position:absolute;

font-size:24px;

z-index:10;

transform:translate(-50%,-50%);

transition:left .1s linear,top .1s linear;

filter:drop-shadow(0 3px 2px #0009);

}

.man.fast{font-size:22px}

.man.strong{font-size:29px}

.man.attack{

animation:punch .2s;

}

@keyframes punch{

50%{transform:translate(-50%,-50%) scale(1.5)}

}

.man.hit{

animation:hit .2s;

}

@keyframes hit{

50%{filter:brightness(2)}

}

.man.dead{

opacity:0;

transform:translate(-50%,-50%) rotate(90deg) scale(.2);

transition:opacity .5s,transform .5s;

}

.effect{

position:absolute;

z-index:40;

font-size:30px;

pointer-events:none;

animation:impact .45s forwards;

}

@keyframes impact{

0%{

opacity:1;

transform:translate(-50%,-50%) scale(.4);

}

100%{

opacity:0;

transform:translate(-50%,-100%) scale(1.5);

}

}

.flash{

position:absolute;

inset:0;

z-index:45;

background:white;

opacity:0;

pointer-events:none;

}

.flash.active{

animation:flash .15s;

}

@keyframes flash{

0%{opacity:.45}

100%{opacity:0}

}

.controls{

margin:7px;

}

button{

border:0;

border-radius:11px;

padding:11px 15px;

margin:3px;

font-size:15px;

font-weight:bold;

cursor:pointer;

}

#start{

background:#16a34a;

color:white;

}

#rageBtn{

background:#dc2626;

color:white;

}

#reset{

background:#e5e7eb;

color:#111;

}

button:active{

transform:scale(.94);

}

#status{

min-height:27px;

font-size:17px;

font-weight:bold;

margin:5px;

}

.legend{

font-size:12px;

color:#cbd5e1;

}

.overlay{

position:absolute;

inset:0;

z-index:100;

display:none;

align-items:center;

justify-content:center;

background:#000b;

}

.overlay.show{

display:flex;

}

.result{

background:#111827;

border:2px solid #6b7280;

border-radius:20px;

padding:24px;

width:85%;

max-width:430px;

box-shadow:0 0 35px #000;

}

.result h2{

font-size:29px;

margin:5px;

}

.result p{

color:#d1d5db;

}

</style>

</head>

<body>

<h1>🦍 BAGARRE HOMMES GORILLE 🧑‍🤝‍🧑</h1>

<div class="subtitle">

100 hommes contre 1 gorille

</div>

<div class="stats">

<div class="stat">

🧑 Vivants :

<b id="menCount">100</b>

</div>

<div class="stat">

⚔️ Attaquants :

<b id="attackers">0</b>

</div>

<div class="stat">

🦍 Vie :

<b id="hpText">1000</b>

</div>

<div class="stat">

🔥 Rage :

<b id="rageText">0%</b>

</div>

</div>

<div class="healthBox">

<div id="health" class="health"></div>

</div>

<div id="viewport" class="viewport">

<div id="world" class="world">

<div class="arenaMark"></div>

<div id="gorilla" class="gorilla">

🦍

</div>

</div>

<div id="flash" class="flash"></div>

<div id="overlay" class="overlay">

<div class="result">

<h2 id="resultTitle"></h2>

<p id="resultText"></p>

<button id="resultReset">

🔄 RECOMMENCER

</button>

</div>

</div>

</div>

<div class="legend">

🧑 Normal · 🏃 Rapide · 💪 Fort

</div>

<div class="controls">

<button id="start">

▶️ LANCER

</button>

<button id="rageBtn">

🔥 RAGE

</button>

<button id="reset">

🔄 RECOMMENCER

</button>

</div>

<div id="status">

Prêt pour la bataille.

</div>

<script>

const viewport=document.getElementById("viewport");

const world=document.getElementById("world");

const gorilla=document.getElementById("gorilla");

const menCount=document.getElementById("menCount");

const attackersText=document.getElementById("attackers");

const hpText=document.getElementById("hpText");

const rageText=document.getElementById("rageText");

const health=document.getElementById("health");

const status=document.getElementById("status");

const flash=document.getElementById("flash");

const overlay=document.getElementById("overlay");

const resultTitle=document.getElementById("resultTitle");

const resultText=document.getElementById("resultText");

let men=[];

let running=false;

let rage=false;

let gorillaX=50;

let gorillaY=50;

let gorillaHP=1000;

const MAX_HP=1000;

let totalKills=0;

let lastMenAttack=0;

let lastGorillaAttack=0;

function random(min,max){

return Math.random()*(max-min)+min;

}

function distance(a,b,c,d){

let x=c-a;

let y=d-b;

return Math.sqrt(x*x+y*y);

}

function aliveMen(){

return men.filter(function(m){

return m.alive;

});

}

function createMen(){

men.forEach(function(m){

m.el.remove();

});

men=[];

for(let i=0;i<100;i++){

let el=document.createElement("div");

let type;

if(i<15){

type="fast";

el.textContent="🏃";

}else if(i<25){

type="strong";

el.textContent="💪";

}else{

type="normal";

el.textContent="🧑";

}

el.className="man "+type;

world.appendChild(el);

let angle=Math.random()*Math.PI*2;

let radius=random(28,46);

let m={

el:el,

type:type,

x:50+Math.cos(angle)*radius,

y:50+Math.sin(angle)*radius*.75,

alive:true,

health:type==="strong"?150:

type==="fast"?80:100,

speed:type==="fast"?.55:

type==="strong"?.27:.38,

damage:type==="strong"?3.2:

type==="fast"?1.4:1.9

};

m.x=Math.max(3,Math.min(97,m.x));

m.y=Math.max(5,Math.min(95,m.y));

men.push(m);

}

updatePositions();

updateStats();

}

function updatePositions(){

gorilla.style.left=gorillaX+"%";

gorilla.style.top=gorillaY+"%";

men.forEach(function(m){

if(!m.alive)return;

m.el.style.left=m.x+"%";

m.el.style.top=m.y+"%";

});

}

function moveMen(){

let alive=aliveMen();

alive.forEach(function(m,index){

let angle=

(Math.PI*2/Math.max(1,alive.length))*index;

let radius=4.7;

let targetX=

gorillaX+

Math.cos(angle)*radius;

let targetY=

gorillaY+

Math.sin(angle)*radius*.8;

let dx=targetX-m.x;

let dy=targetY-m.y;

let d=Math.sqrt(dx*dx+dy*dy);

if(d>.5){

m.x+=(dx/d)*m.speed*.32;

m.y+=(dy/d)*m.speed*.32;

}

m.x=Math.max(2,Math.min(98,m.x));

m.y=Math.max(4,Math.min(96,m.y));

});

}

function moveGorilla(){

let alive=aliveMen();

if(alive.length===0)return;

let target=null;

let best=Infinity;

alive.forEach(function(m){

let d=distance(

gorillaX,

gorillaY,

m.x,

m.y

);

if(d<best){

best=d;

target=m;

}

});

if(!target)return;

let dx=target.x-gorillaX;

let dy=target.y-gorillaY;

let d=Math.sqrt(dx*dx+dy*dy);

if(d>4){

let speed=rage?.34:.20;

gorillaX+=(dx/d)*speed;

gorillaY+=(dy/d)*speed;

}

gorillaX=Math.max(5,Math.min(95,gorillaX));

gorillaY=Math.max(7,Math.min(93,gorillaY));

}

function createEffect(x,y,text){

let e=document.createElement("div");

e.className="effect";

e.textContent=text;

e.style.left=x+"%";

e.style.top=y+"%";

world.appendChild(e);

setTimeout(function(){

e.remove();

},450);

}

function screenFlash(){

flash.classList.remove("active");

void flash.offsetWidth;

flash.classList.add("active");

}

function menAttack(){

let now=Date.now();

if(now-lastMenAttack<180)return;

lastMenAttack=now;

let alive=aliveMen();

let damage=0;

let attackers=0;

alive.forEach(function(m){

let d=distance(

m.x,

m.y,

gorillaX,

gorillaY

);

if(d<7){

attackers++;

damage+=m.damage;

m.el.classList.add("attack");

setTimeout(function(){

m.el.classList.remove("attack");

},200);

createEffect(

gorillaX+random(-3,3),

gorillaY+random(-3,3),

"💥"

);

}

});

if(attackers>0){

gorillaHP-=damage;

if(gorillaHP<0){

gorillaHP=0;

}

}

}

function gorillaAttack(){

let now=Date.now();

if(now-lastGorillaAttack<500)return;

lastGorillaAttack=now;

let alive=aliveMen();

let nearby=alive.filter(function(m){

return distance(

m.x,

m.y,

gorillaX,

gorillaY

)<6.5;

});

if(nearby.length===0)return;

let victims=nearby

.sort(function(){

return Math.random()-.5;

})

.slice(0,rage?3:1);

gorilla.style.transform=

"translate(-50%,-50%) scale(1.2)";

screenFlash();

setTimeout(function(){

gorilla.style.transform=

"translate(-50%,-50%) scale(1)";

},180);

victims.forEach(function(m){

let damage=rage?90:65;

m.health-=damage;

m.el.classList.add("hit");

createEffect(

m.x,

m.y,

"💥"

);

setTimeout(function(){

m.el.classList.remove("hit");

},250);

if(m.health<=0){

m.alive=false;

m.el.classList.add("dead");

totalKills++;

}

});

}

function updateRage(){

let percent=

Math.round((1-gorillaHP/MAX_HP)*100);

percent=Math.max(0,Math.min(100,percent));

rageText.textContent=percent+"%";

if(percent>=60&&!rage){

rage=true;

gorilla.classList.add("rage");

status.textContent=

"🔥 LE GORILLE ENTRE EN RAGE !";

}

}

function updateHealth(){

let percent=

Math.max(0,gorillaHP/MAX_HP*100);

health.style.width=percent+"%";

hpText.textContent=Math.round(gorillaHP);

if(percent<25){

health.style.background="#ef4444";

}else if(percent<55){

health.style.background="#f59e0b";

}else{

health.style.background="#22c55e";

}

updateRage();

}

function updateStats(){

let alive=aliveMen();

menCount.textContent=alive.length;

attackersText.textContent=

alive.filter(function(m){

return distance(

m.x,

m.y,

gorillaX,

gorillaY

)<7;

}).length;

}

function updateCamera(){

/*

La caméra regarde légèrement

vers le gorille et l'action.

*/

let cameraX=

50+(gorillaX-50)*0.55;

let cameraY=

50+(gorillaY-50)*0.55;

let offsetX=

(cameraX-50)*0.65;

let offsetY=

(cameraY-50)*0.65;

let zoom=1;

if(rage){

zoom=1.08;

}

world.style.transform=

"translate("+(-offsetX)+"%,"+

(-offsetY)+"%) scale("+zoom+")";

}

function finishMen(){

running=false;

gorilla.classList.remove("rage");

resultTitle.textContent=

"🏆 VICTOIRE DES HOMMES !";

resultText.textContent=

"Le gorille est vaincu. "+

totalKills+

" hommes ont été éliminés.";

overlay.classList.add("show");

status.textContent=

"🏆 Les hommes remportent la bataille !";

}

function finishGorilla(){

running=false;

gorilla.classList.remove("rage");

resultTitle.textContent=

"🦍 VICTOIRE DU GORILLE !";

resultText.textContent=

"Le gorille a éliminé les 100 hommes.";

overlay.classList.add("show");

status.textContent=

"🦍 Le gorille remporte la bataille !";

}

function gameLoop(){

if(running){

moveMen();

moveGorilla();

menAttack();

gorillaAttack();

updatePositions();

updateStats();

updateHealth();

updateCamera();

if(gorillaHP<=0){

finishMen();

}

if(aliveMen().length===0){

finishGorilla();

}

}

requestAnimationFrame(gameLoop);

}

function resetGame(){

running=false;

rage=false;

gorillaHP=MAX_HP;

gorillaX=50;

gorillaY=50;

totalKills=0;

gorilla.classList.remove("rage");

world.style.transform=

"translate(0%,0%) scale(1)";

overlay.classList.remove("show");

status.textContent=

"Prêt pour la bataille.";

createMen();

updateHealth();

updateStats();

}

document.getElementById("start")

.addEventListener("click",function(){

if(!running){

running=true;

status.textContent=

"⚔️ LA BATAILLE COMMENCE !";

}

});

document.getElementById("rageBtn")

.addEventListener("click",function(){

if(!running)return;

rage=true;

gorilla.classList.add("rage");

status.textContent=

"🔥 MODE RAGE ACTIVÉ !";

});

document.getElementById("reset")

.addEventListener("click",resetGame);

document.getElementById("resultReset")

.addEventListener("click",resetGame);

resetGame();

gameLoop();

</script>

</body>

</html>
