<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>100 Hommes vs 1 Gorille</title>

<style>

*{

box-sizing:border-box;

-webkit-tap-highlight-color:transparent;

}

body{

margin:0;

background:#080b10;

color:white;

font-family:Arial,sans-serif;

text-align:center;

overflow:hidden;

touch-action:none;

}

h1{

margin:7px 0 2px;

font-size:23px;

}

.subtitle{

color:#9ca3af;

font-size:12px;

}

.stats{

display:flex;

justify-content:center;

gap:5px;

flex-wrap:wrap;

margin:5px;

}

.stat{

background:#17202a;

padding:5px 8px;

border-radius:8px;

font-size:12px;

font-weight:bold;

}

.healthBox{

width:82%;

max-width:600px;

height:18px;

margin:5px auto;

background:#292929;

border:2px solid #666;

border-radius:20px;

overflow:hidden;

}

.health{

height:100%;

width:100%;

background:#22c55e;

transition:width .2s;

}

.viewport{

position:relative;

width:96%;

height:55vh;

min-height:360px;

max-height:560px;

margin:auto;

overflow:hidden;

border:3px solid #4b5563;

border-radius:18px;

background:#17231a;

box-shadow:0 0 25px #000;

}

.world{

position:absolute;

width:160%;

height:160%;

left:-30%;

top:-30%;

background:

radial-gradient(circle,#496742,#29402c 48%,#111a14 100%);

will-change:transform;

}

.arenaMark{

position:absolute;

left:50%;

top:50%;

width:78%;

height:72%;

transform:translate(-50%,-50%);

border:2px solid #ffffff22;

border-radius:50%;

}

.gorilla{

position:absolute;

font-size:88px;

z-index:20;

transform:translate(-50%,-50%);

will-change:left,top,transform;

}

.gorilla.rage{

animation:rage .28s infinite alternate;

}

@keyframes rage{

from{

transform:translate(-50%,-50%) scale(1);

}

to{

transform:translate(-50%,-50%) scale(1.1);

}

}

.man{

position:absolute;

font-size:25px;

z-index:10;

transform:translate(-50%,-50%);

will-change:left,top;

}

.man.fast{

font-size:23px;

}

.man.strong{

font-size:29px;

}

.man.attack{

animation:attack .18s;

}

@keyframes attack{

50%{

transform:translate(-50%,-50%) scale(1.35);

}

}

.man.dead{

opacity:0;

transform:translate(-50%,-50%) scale(.25);

transition:opacity .35s;

}

.effect{

position:absolute;

z-index:30;

font-size:27px;

pointer-events:none;

animation:effect .3s forwards;

}

@keyframes effect{

0%{

opacity:1;

transform:translate(-50%,-50%) scale(.5);

}

100%{

opacity:0;

transform:translate(-50%,-80%) scale(1.2);

}

}

.controls{

margin:5px;

}

button{

border:0;

border-radius:10px;

padding:10px 13px;

margin:3px;

font-size:14px;

font-weight:bold;

cursor:pointer;

}

button:active{

transform:scale(.92);

}

#start{

background:#16a34a;

color:white;

}

#rageBtn{

background:#dc2626;

color:white;

}

#reset{

background:#e5e7eb;

color:#111;

}

.cameraControls{

display:grid;

grid-template-columns:45px 45px 45px;

grid-template-rows:42px 42px;

justify-content:center;

gap:3px;

margin:3px;

}

.cameraControls button{

margin:0;

padding:0;

font-size:20px;

background:#263241;

color:white;

border:1px solid #4b5563;

}

.up{

grid-column:2;

grid-row:1;

}

.left{

grid-column:1;

grid-row:2;

}

.down{

grid-column:2;

grid-row:2;

}

.right{

grid-column:3;

grid-row:2;

}

.zoomControls{

margin:3px;

}

.zoomControls button{

background:#334155;

color:white;

font-size:16px;

}

#status{

min-height:22px;

font-size:15px;

font-weight:bold;

margin:3px;

}

.legend{

font-size:11px;

color:#cbd5e1;

}

.overlay{

position:absolute;

inset:0;

z-index:100;

display:none;

align-items:center;

justify-content:center;

background:#000b;

}

.overlay.show{

display:flex;

}

.result{

background:#111827;

border:2px solid #6b7280;

border-radius:18px;

padding:22px;

width:85%;

max-width:420px;

}

.result h2{

font-size:28px;

margin:5px;

}

.result p{

color:#d1d5db;

}

</style>

</head>

<body>

<h1>🦍 100 HOMMES VS 1 GORILLE 🧑‍🤝‍🧑</h1>

<div class="subtitle">

Le gorille possède un léger avantage

</div>

<div class="stats">

<div class="stat">

🧑 Vivants:

<b id="menCount">100</b>

</div>

<div class="stat">

⚔️ Attaquants:

<b id="attackers">0</b>

</div>

<div class="stat">

🦍 Vie:

<b id="hpText">1300</b>

</div>

<div class="stat">

🔥 Rage:

<b id="rageText">0%</b>

</div>

</div>

<div class="healthBox">

<div id="health" class="health"></div>

</div>

<div id="viewport" class="viewport">

<div id="world" class="world">

<div class="arenaMark"></div>

<div id="gorilla" class="gorilla">

🦍

</div>

</div>

<div id="overlay" class="overlay">

<div class="result">

<h2 id="resultTitle"></h2>

<p id="resultText"></p>

<button id="resultReset">

🔄 RECOMMENCER

</button>

</div>

</div>

</div>

<div class="legend">

🧑 Normal · 🏃 Rapide · 💪 Fort

</div>

<div class="controls">

<button id="start">

▶️ LANCER

</button>

<button id="rageBtn">

🔥 RAGE

</button>

<button id="reset">

🔄 RECOMMENCER

</button>

</div>

<div class="cameraControls">

<button class="up" id="camUp">⬆️</button>

<button class="left" id="camLeft">⬅️</button>

<button class="down" id="camDown">⬇️</button>

<button class="right" id="camRight">➡️</button>

</div>

<div class="zoomControls">

<button id="zoomOut">➖</button>

<button id="zoomReset">🔍</button>

<button id="zoomIn">➕</button>

</div>

<div id="status">

Prêt pour la bataille.

</div>

<script>

const world=document.getElementById("world");

const gorilla=document.getElementById("gorilla");

const menCount=document.getElementById("menCount");

const attackersText=document.getElementById("attackers");

const hpText=document.getElementById("hpText");

const rageText=document.getElementById("rageText");

const health=document.getElementById("health");

const status=document.getElementById("status");

const overlay=document.getElementById("overlay");

const resultTitle=document.getElementById("resultTitle");

const resultText=document.getElementById("resultText");

let men=[];

let running=false;

let rage=false;

let gorillaX=50;

let gorillaY=50;

const MAX_HP=1300;

let gorillaHP=MAX_HP;

let totalKills=0;

let lastMenAttack=0;

let lastGorillaAttack=0;

let lastLogic=0;

let lastCamera=0;

let cameraX=0;

let cameraY=0;

let zoom=1;

function random(min,max){

return Math.random()*(max-min)+min;

}

function distance(a,b,c,d){

let x=c-a;

let y=d-b;

return Math.sqrt(x*x+y*y);

}

function getAlive(){

return men.filter(function(m){

return m.alive;

});

}

function createMen(){

men.forEach(function(m){

m.el.remove();

});

men=[];

for(let i=0;i<100;i++){

let el=document.createElement("div");

let type;

if(i<15){

type="fast";

el.textContent="🏃";

}else if(i<25){

type="strong";

el.textContent="💪";

}else{

type="normal";

el.textContent="🧑";

}

el.className="man "+type;

world.appendChild(el);

let angle=Math.random()*Math.PI*2;

let radius=random(28,46);

let m={

el:el,

type:type,

x:50+Math.cos(angle)*radius,

y:50+Math.sin(angle)*radius*.75,

alive:true,

health:type==="strong"?150:

type==="fast"?80:100,

speed:type==="fast"?.55:

type==="strong"?.27:.38,

damage:type==="strong"?2.7:

type==="fast"?1.2:1.6

};

m.x=Math.max(3,Math.min(97,m.x));

m.y=Math.max(5,Math.min(95,m.y));

men.push(m);

}

updatePositions();

updateStats();

}

function updatePositions(){

gorilla.style.left=gorillaX+"%";

gorilla.style.top=gorillaY+"%";

for(let i=0;i<men.length;i++){

let m=men[i];

if(!m.alive)continue;

m.el.style.left=m.x+"%";

m.el.style.top=m.y+"%";

}

}

function moveMen(){

let alive=getAlive();

let count=alive.length;

if(count===0)return;

for(let i=0;i<count;i++){

let m=alive[i];

let angle=(Math.PI*2/count)*i;

let radius=4.8;

let targetX=

gorillaX+

Math.cos(angle)*radius;

let targetY=

gorillaY+

Math.sin(angle)*radius*.8;

let dx=targetX-m.x;

let dy=targetY-m.y;

let d=Math.sqrt(dx*dx+dy*dy);

if(d>.5){

m.x+=(dx/d)*m.speed*.34;

m.y+=(dy/d)*m.speed*.34;

}

m.x=Math.max(2,Math.min(98,m.x));

m.y=Math.max(4,Math.min(96,m.y));

}

}

function moveGorilla(){

let alive=getAlive();

if(alive.length===0)return;

let target=null;

let best=9999;

for(let i=0;i<alive.length;i++){

let m=alive[i];

let d=distance(

gorillaX,

gorillaY,

m.x,

m.y

);

if(d<best){

best=d;

target=m;

}

}

if(!target)return;

let dx=target.x-gorillaX;

let dy=target.y-gorillaY;

let d=Math.sqrt(dx*dx+dy*dy);

if(d>4){

let speed=rage?.38:.23;

gorillaX+=(dx/d)*speed;

gorillaY+=(dy/d)*speed;

}

gorillaX=Math.max(5,Math.min(95,gorillaX));

gorillaY=Math.max(7,Math.min(93,gorillaY));

}

function createEffect(x,y){

let e=document.createElement("div");

e.className="effect";

e.textContent="💥";

e.style.left=x+"%";

e.style.top=y+"%";

world.appendChild(e);

setTimeout(function(){

e.remove();

},300);

}

function menAttack(){

let now=Date.now();

if(now-lastMenAttack<240)return;

lastMenAttack=now;

let alive=getAlive();

let damage=0;

let attackers=0;

for(let i=0;i<alive.length;i++){

let m=alive[i];

let d=distance(

m.x,

m.y,

gorillaX,

gorillaY

);

if(d<7){

attackers++;

damage+=m.damage;

if(attackers<=6){

m.el.classList.add("attack");

setTimeout(function(){

m.el.classList.remove("attack");

},180);

createEffect(

gorillaX+random(-2,2),

gorillaY+random(-2,2)

);

}

}

}

if(attackers>0){

gorillaHP-=damage;

if(gorillaHP<0){

gorillaHP=0;

}

}

}

function gorillaAttack(){

let now=Date.now();

if(now-lastGorillaAttack<520)return;

lastGorillaAttack=now;

let alive=getAlive();

let nearby=[];

for(let i=0;i<alive.length;i++){

let m=alive[i];

if(distance(

m.x,

m.y,

gorillaX,

gorillaY

)<6.8){

nearby.push(m);

}

}

if(nearby.length===0)return;

let number=rage?4:2;

for(let i=0;i<number;i++){

if(nearby.length===0)break;

let index=

Math.floor(Math.random()*nearby.length);

let m=nearby.splice(index,1)[0];

m.health-=rage?110:80;

createEffect(m.x,m.y);

if(m.health<=0){

m.alive=false;

m.el.classList.add("dead");

totalKills++;

}

}

}

function updateHealth(){

let percent=

Math.max(0,gorillaHP/MAX_HP*100);

health.style.width=percent+"%";

hpText.textContent=Math.round(gorillaHP);

if(percent<25){

health.style.background="#ef4444";

}else if(percent<55){

health.style.background="#f59e0b";

}else{

health.style.background="#22c55e";

}

let ragePercent=

Math.round((1-gorillaHP/MAX_HP)*100);

ragePercent=

Math.max(0,Math.min(100,ragePercent));

rageText.textContent=ragePercent+"%";

if(ragePercent>=55&&!rage){

rage=true;

gorilla.classList.add("rage");

status.textContent=

"🔥 LE GORILLE ENTRE EN RAGE !";

}

}

function updateStats(){

let alive=getAlive();

menCount.textContent=alive.length;

let attackers=0;

for(let i=0;i<alive.length;i++){

if(distance(

alive[i].x,

alive[i].y,

gorillaX,

gorillaY

)<7){

attackers++;

}

}

attackersText.textContent=attackers;

}

function updateCamera(){

let autoX=(gorillaX-50)*.45;

let autoY=(gorillaY-50)*.45;

let finalX=autoX+cameraX;

let finalY=autoY+cameraY;

world.style.transform=

"translate("+(-finalX)+"%,"+

(-finalY)+"%) scale("+zoom+")";

}

function moveCamera(x,y){

cameraX+=x;

cameraY+=y;

cameraX=Math.max(-25,Math.min(25,cameraX));

cameraY=Math.max(-25,Math.min(25,cameraY));

updateCamera();

}

function finishMen(){

running=false;

gorilla.classList.remove("rage");

resultTitle.textContent=

"🏆 VICTOIRE DES HOMMES !";

resultText.textContent=

"Le gorille est vaincu. "+

totalKills+

" hommes ont été éliminés.";

overlay.classList.add("show");

status.textContent=

"🏆 Les hommes gagnent !";

}

function finishGorilla(){

running=false;

gorilla.classList.remove("rage");

resultTitle.textContent=

"🦍 VICTOIRE DU GORILLE !";

resultText.textContent=

"Le gorille a éliminé les 100 hommes.";

overlay.classList.add("show");

status.textContent=

"🦍 LE GORILLE GAGNE !";

}

function gameLoop(time){

if(running){

if(time-lastLogic>40){

moveMen();

moveGorilla();

menAttack();

gorillaAttack();

updatePositions();

updateStats();

updateHealth();

lastLogic=time;

}

if(time-lastCamera>100){

updateCamera();

lastCamera=time;

}

if(gorillaHP<=0){

finishMen();

}

if(getAlive().length===0){

finishGorilla();

}

}

requestAnimationFrame(gameLoop);

}

function resetGame(){

running=false;

rage=false;

gorillaHP=MAX_HP;

gorillaX=50;

gorillaY=50;

cameraX=0;

cameraY=0;

zoom=1;

totalKills=0;

gorilla.classList.remove("rage");

world.style.transform=

"translate(0%,0%) scale(1)";

overlay.classList.remove("show");

status.textContent=

"Prêt pour la bataille.";

createMen();

updateHealth();

updateStats();

}

document.getElementById("start")

.addEventListener("click",function(){

if(!running){

running=true;

status.textContent=

"⚔️ LA BATAILLE COMMENCE !";

}

});

document.getElementById("rageBtn")

.addEventListener("click",function(){

if(!running)return;

rage=true;

gorilla.classList.add("rage");

status.textContent=

"🔥 MODE RAGE ACTIVÉ !";

});

document.getElementById("reset")

.addEventListener("click",resetGame);

document.getElementById("resultReset")

.addEventListener("click",resetGame);

document.getElementById("camUp")

.addEventListener("click",function(){

moveCamera(0,-5);

});

document.getElementById("camDown")

.addEventListener("click",function(){

moveCamera(0,5);

});

document.getElementById("camLeft")

.addEventListener("click",function(){

moveCamera(-5,0);

});

document.getElementById("camRight")

.addEventListener("click",function(){

moveCamera(5,0);

});

document.getElementById("zoomIn")

.addEventListener("click",function(){

zoom=Math.min(1.4,zoom+.1);

updateCamera();

});

document.getElementById("zoomOut")

.addEventListener("click",function(){

zoom=Math.max(.8,zoom-.1);

updateCamera();

});

document.getElementById("zoomReset")

.addEventListener("click",function(){

zoom=1;

cameraX=0;

cameraY=0;

updateCamera();

});

resetGame();

requestAnimationFrame(gameLoop);

</script>

</body>

</html>
