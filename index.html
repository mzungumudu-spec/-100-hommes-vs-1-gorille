<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Hommes vs Gorille</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 25px;
      font-size: 32px;
    }

    #game {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .arena {
      position: relative;
      height: 420px;
      background: linear-gradient(#263238, #111);
      border: 3px solid #555;
      border-radius: 15px;
      overflow: hidden;
      margin-top: 20px;
    }

    .fighter {
      position: absolute;
      font-size: 45px;
      user-select: none;
    }

    #gorilla {
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 90px;
    }

    #men {
      left: 20px;
      bottom: 20px;
      font-size: 40px;
      max-width: 700px;
    }

    .controls {
      margin-top: 20px;
    }

    button {
      padding: 14px 22px;
      margin: 6px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }

    #attack {
      background: #d32f2f;
      color: white;
    }

    #reset {
      background: #eeeeee;
      color: #111;
    }

    #status {
      margin-top: 15px;
      font-size: 20px;
      min-height: 30px;
    }

    .bar {
      width: 80%;
      height: 25px;
      background: #333;
      border-radius: 20px;
      margin: 10px auto;
      overflow: hidden;
    }

    #health {
      height: 100%;
      width: 100%;
      background: #4caf50;
      transition: width 0.3s;
    }

    #score {
      font-size: 22px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="game">

  <h1>🦍 100 HOMMES VS GORILLE 🧑‍🤝‍🧑</h1>

  <div id="score">
    Hommes restants : <span id="menCount">100</span>
  </div>

  <div class="bar">
    <div id="health"></div>
  </div>

  <div class="arena">

    <div id="gorilla" class="fighter">🦍</div>

    <div id="men" class="fighter">
      🧑 🧑 🧑 🧑 🧑 🧑 🧑 🧑 🧑 🧑
    </div>

  </div>

  <div class="controls">
    <button id="attack">⚔️ ATTAQUER</button>
    <button id="reset">🔄 RECOMMENCER</button>
  </div>

  <div id="status">
    Le combat commence ! Les 100 hommes affrontent le gorille.
  </div>

</div>

<script>

let men = 100;
let gorillaHealth = 100;

const menCount = document.getElementById("menCount");
const health = document.getElementById("health");
const status = document.getElementById("status");

document.getElementById("attack").addEventListener("click", function() {

  if (men <= 0 || gorillaHealth <= 0) {
    return;
  }

  // Les hommes attaquent
  let damage = Math.floor(Math.random() * 8) + 3;

  gorillaHealth -= damage;

  if (gorillaHealth < 0) {
    gorillaHealth = 0;
  }

  // Le gorille riposte
  let casualties = Math.floor(Math.random() * 4) + 1;

  men -= casualties;

  if (men < 0) {
    men = 0;
  }

  menCount.textContent = men;
  health.style.width = gorillaHealth + "%";

  status.textContent =
    "Les hommes infligent " + damage +
    " dégâts ! Le gorille élimine " + casualties + " homme(s).";

  // Victoire des hommes
  if (gorillaHealth <= 0) {
    status.textContent = "🏆 VICTOIRE DES 100 HOMMES ! Le gorille est vaincu !";
    return;
  }

  // Victoire du gorille
  if (men <= 0) {
    status.textContent = "🦍 VICTOIRE DU GORILLE ! Tous les hommes sont à terre !";
    return;
  }

});

document.getElementById("reset").addEventListener("click", function() {

  men = 100;
  gorillaHealth = 100;

  menCount.textContent = men;
  health.style.width = "100%";

  status.textContent =
    "Le combat recommence ! Que le meilleur gagne !";

});

</script>

</body>
</html>
